<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwapCityClassic</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    #earth { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
    #game { position: fixed; inset: 0; }
    #earth-top { position: fixed; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
    #earth-attrib { position: fixed; right: 10px; bottom: 26px; display: none; align-items: center; justify-content: flex-end; gap: 8px; max-width: 42%; color: rgba(255,255,255,.9); font: 10px/1.3 Arial, sans-serif; text-shadow: 0 1px 2px #000, 0 0 3px #000; pointer-events: none; }
    #earth-attrib img { height: 18px; flex: none; }
    #tune select { width: 100%; margin-top: 3px; padding: 4px 6px; font: inherit; background: #26303a; color: #dfe4e7; border: 1px solid #45525d; border-radius: 5px; }
    #nav { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; max-width: calc(100% - 340px); padding: 5px 16px 5px 6px; background: rgba(16, 19, 21, 0.72); border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 40px; color: #f1f3f4; pointer-events: none; box-sizing: border-box; }
    #nav svg { flex: none; }
    #nav .street { font: 800 17px/1.15 "Arial Black", Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #ffd24a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
    #nav .sub { font: 12px/1.35 Menlo, monospace; color: #cfd6da; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #nav .txt { min-width: 0; }
    #tune { position: fixed; top: 8px; right: 8px; width: 290px; max-height: calc(100% - 40px); overflow-y: auto; box-sizing: border-box; padding: 10px 12px 12px; background: rgba(16, 19, 21, 0.88); color: #dfe4e7; font: 12px/1.35 Menlo, monospace; border: 1px solid #38424a; border-radius: 8px; }
    #tune[hidden] { display: none; }
    #tune h3 { margin: 0 0 6px; font-size: 13px; } #tune h3 small { color: #8a959c; font-weight: normal; margin-left: 6px; }
    #tune h4 { margin: 12px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #e6ac00; }
    #tune .row { display: block; margin: 7px 0; } #tune .top { display: flex; justify-content: space-between; gap: 8px; }
    #tune input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #e6ac00; }
    #tune small { color: #8a959c; } #tune .presets, #tune .foot { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    #tune button { font: inherit; padding: 4px 8px; background: #26303a; color: #dfe4e7; border: 1px solid #45525d; border-radius: 5px; cursor: pointer; }
    #tune button:hover { background: #33404b; }
    #tune textarea { width: 100%; box-sizing: border-box; margin-top: 6px; background: #0e1113; color: #9fb0ba; border: 1px solid #38424a; border-radius: 5px; font: 10px/1.3 Menlo, monospace; resize: none; }
    #attrib { position: fixed; right: 10px; bottom: 6px; margin: 0; color: rgba(230, 234, 236, 0.78); font: 11px/1.3 Menlo, monospace; text-align: right; pointer-events: none; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
    #hud { position: fixed; left: 10px; bottom: 6px; margin: 0; color: #cfd5d9; font: 12px/1.5 Menlo, monospace; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <canvas id="earth"></canvas>
  <div id="game"></div>
  <canvas id="earth-top"></canvas>
  <div id="earth-attrib"></div>
  <pre id="hud"></pre>
  <p id="attrib">Map data &copy; OpenStreetMap contributors (ODbL)</p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
